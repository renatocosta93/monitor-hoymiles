name: Monitor Hoymiles 30min

on:
  schedule:
    # Executa a cada 30 minutos (nos minutos 00 e 30), das 05h às 19h30 BRT / 08h às 22h30 UTC.
    # Nota: Execuções no GitHub Actions podem sofrer atrasos dependendo da fila do servidor.
    - cron: '0,30 8-22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache do Playwright e Dependências
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/pip
          key: ${{ runner.os }}-hoymiles-cache-v1
          restore-keys: |
            ${{ runner.os }}-hoymiles-cache-

      - name: Instalar Dependências e Navegador
        run: |
          pip install playwright requests
          if [ "${{ steps.cache-deps.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium
          fi

      - name: Executar Monitoramento
        run: python monitor_hoymiles.py

      - name: Publicar Painel Web e Estado
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html state.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Solar Web Dashboard [skip ci]" && git push)
