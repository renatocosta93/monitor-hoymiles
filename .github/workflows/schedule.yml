
name: Monitor Hoymiles 30min

on:
  schedule:
    # Executa a cada 30 min apenas durante o dia (05h00 às 19h30 BRT / 08h00 às 22h30 UTC)
    - cron: '*/30 8-22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache do Navegador Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Instalar Dependências e Navegador
        run: |
          pip install playwright requests
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium
          fi

      - name: Executar Monitoramento
        run: python monitor_hoymiles.py

      - name: Publicar Painel Web e Estado
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html state.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Solar Web Dashboard [skip ci]" && git push)
